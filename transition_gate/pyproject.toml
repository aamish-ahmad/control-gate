[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "intent-transition-gate"
version = "0.1.0"
description = "Side-effect-free purpose/authority/deadline transition controller for human-directed agents"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Aamish Ahmad"}]
keywords = ["agents", "intent", "control", "uncertainty", "human-in-the-loop", "commitment"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
